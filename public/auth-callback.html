<!DOCTYPE html>
<html>
  <head>
    <title>Autenticando...</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f9fafb;
      }
      .loader {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #059669;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
        margin-right: 12px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader"></div>
    <p>Conectando ao Tefé Market...</p>
    <script>
      // Envia uma mensagem para a janela pai informando que o login foi concluído
      // O Supabase Auth vai processar o hash da URL no window.opener
      if (window.opener) {
        window.opener.postMessage({ type: 'SUPABASE_AUTH_CALLBACK' }, '*');
        window.close();
      } else {
        // Fallback para caso não tenha opener (não deveria acontecer em popup)
        window.location.href = '/';
      }
    </script>
  </body>
</html>
